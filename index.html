<!DOCTYPE html>
<html lang="es">

<head>

<title>San Rafael AR - Sistema Solar</title>

<!-- A-FRAME -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- AR.JS -->
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


<style>

/* =========================
   PANTALLA
========================= */

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}


/* =========================
   VIDEO DE LA CÁMARA
========================= */

#arjs-video {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;

    width: 100% !important;
    height: 100% !important;

    object-fit: contain !important;
    object-position: center center !important;

    z-index: 0 !important;
}


/* =========================
   LIENZO AR
========================= */

.a-canvas {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;

    width: 100% !important;
    height: 100% !important;

    z-index: 1 !important;
}


/* =========================
   TITULO
========================= */

#titulo {

    position: fixed;

    top: 12px;
    left: 0;
    right: 0;

    z-index: 9999;

    text-align: center;

    color: white;

    font-family: Arial, sans-serif;

    text-shadow:
        2px 2px 5px black;

    pointer-events: none;
}


#titulo h1 {

    margin: 0;

    font-size: 27px;
}


#titulo p {

    margin: 4px;

    font-size: 15px;
}


/* =========================
   INSTRUCCIÓN
========================= */

#instruccion {

    position: fixed;

    bottom: 18px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 9999;

    background: rgba(0,0,0,0.70);

    color: white;

    padding: 10px 18px;

    border-radius: 20px;

    font-family: Arial, sans-serif;

    font-size: 14px;

    text-align: center;

    width: 80%;

    pointer-events: none;
}


/* =========================
   FICHA DEL PLANETA
========================= */

#infoPlaneta {

    display: none;

    position: fixed;

    top: 50%;

    left: 50%;

    transform: translate(-50%, -50%);

    width: 82%;

    max-width: 380px;

    background: rgba(10, 15, 30, 0.95);

    border: 2px solid white;

    border-radius: 20px;

    padding: 20px;

    color: white;

    font-family: Arial, sans-serif;

    text-align: center;

    z-index: 20000;

    box-shadow:
        0 0 30px rgba(255,255,255,0.4);
}


#infoPlaneta h2 {

    margin-top: 0;

    font-size: 27px;
}


#infoPlaneta p {

    font-size: 16px;

    line-height: 1.5;

    margin-bottom: 18px;
}


/* =========================
   BOTON CERRAR
========================= */

#cerrarInfo {

    background: white;

    color: black;

    border: none;

    border-radius: 20px;

    padding: 10px 25px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}


#cerrarInfo:active {

    transform: scale(0.95);
}

</style>


<script>

/* =====================================================
   COMPONENTE PARA LAS ÓRBITAS
===================================================== */

AFRAME.registerComponent('orbita', {

    schema: {

        velocidad: {
            type: 'number',
            default: 0.01
        },

        radio: {
            type: 'number',
            default: 1
        }

    },


    init: function () {

        this.angulo =
            Math.random() * Math.PI * 2;

    },


    tick: function (time, deltaTime) {

        this.angulo +=
            this.data.velocidad *
            (deltaTime / 16);


        const x =
            Math.cos(this.angulo) *
            this.data.radio;


        const z =
            Math.sin(this.angulo) *
            this.data.radio;


        this.el.object3D.position.x = x;

        this.el.object3D.position.z = z;

    }

});


/* =====================================================
   INFORMACIÓN DE LOS PLANETAS
===================================================== */

const datosPlanetas = {

    Mercurio: {

        titulo: "☿️ Mercurio",

        texto:
        "Mercurio es el planeta más cercano al Sol y también el más pequeño del Sistema Solar. Su superficie presenta numerosos cráteres y tiene temperaturas muy extremas."
    },


    Venus: {

        titulo: "♀️ Venus",

        texto:
        "Venus es el segundo planeta desde el Sol. Posee una atmósfera muy densa y es el planeta más caliente del Sistema Solar debido a su intenso efecto invernadero."
    },


    Tierra: {

        titulo: "🌎 Tierra",

        texto:
        "La Tierra es el tercer planeta desde el Sol. Posee agua líquida en abundancia y es el único planeta conocido que alberga vida."
    },


    Marte: {

        titulo: "🔴 Marte",

        texto:
        "Marte es conocido como el planeta rojo debido al óxido de hierro presente en su superficie. Tiene montañas, valles, volcanes y antiguos cauces de agua."
    },


    Júpiter: {

        titulo: "🟠 Júpiter",

        texto:
        "Júpiter es el planeta más grande del Sistema Solar. Es un gigante gaseoso y posee una enorme tormenta conocida como la Gran Mancha Roja."
    },


    Saturno: {

        titulo: "🪐 Saturno",

        texto:
        "Saturno es un gigante gaseoso famoso por su espectacular sistema de anillos, formado principalmente por partículas de hielo y roca."
    },


    Urano: {

        titulo: "🔵 Urano",

        texto:
        "Urano es un gigante helado de color azul verdoso. Su eje de rotación está muy inclinado, por lo que parece girar prácticamente de lado."
    },


    Neptuno: {

        titulo: "🔵 Neptuno",

        texto:
        "Neptuno es el planeta más alejado del Sol. Es un gigante helado y presenta algunos de los vientos más rápidos conocidos del Sistema Solar."
    }

};


/* =====================================================
   MOSTRAR INFORMACIÓN
===================================================== */

function mostrarPlaneta(nombre) {

    const datos =
        datosPlanetas[nombre];


    if (!datos) {

        return;

    }


    document.getElementById("tituloPlaneta").innerText =
        datos.titulo;


    document.getElementById("textoPlaneta").innerText =
        datos.texto;


    document.getElementById("infoPlaneta").style.display =
        "block";

}


/* =====================================================
   CERRAR INFORMACIÓN
===================================================== */

function cerrarInfo() {

    document.getElementById("infoPlaneta").style.display =
        "none";

}


/* =====================================================
   ACTIVAR LOS PLANETAS
===================================================== */

document.addEventListener("DOMContentLoaded", function () {


    document
        .getElementById("cerrarInfo")
        .addEventListener("click", cerrarInfo);


    const planetas =
        document.querySelectorAll(".planeta");


    planetas.forEach(function(planeta) {


        planeta.addEventListener("click", function () {


            const nombre =
                planeta.getAttribute("data-planeta");


            mostrarPlaneta(nombre);

        });

    });

});

</script>

</head>


<body>


<!-- =================================================
     TITULO
================================================= -->

<div id="titulo">

    <h1>🌞 SAN RAFAEL AR 🪐</h1>

    <p>
        El Sistema Solar cobra vida
    </p>

</div>


<!-- =================================================
     INSTRUCCIÓN
================================================= -->

<div id="instruccion">

    🔎 Apunta al marcador y toca un planeta para explorar

<!-- =================================================
     VENTANA DE INFORMACIÓN
================================================= -->

<div id="infoPlaneta">

    <h2 id="tituloPlaneta">

<!-- =================================================

================================================= -->

    vr-mode-ui="enabled: false"

    renderer="

        alpha: true;
        logarithmicDepthBuffer: true;
    "

    arjs="
        sourceType: webcam;
        debugUIEnabled: false;
    "
>


<!-- =================================================
     MARCADOR HIRO
================================================= -->

<a-marker preset="hiro">


<!-- =================================================
     SISTEMA SOLAR
================================================= -->

    id="sistemaSolar"

    position="0 0 0"

    scale="0.40 0.40 0.40"
>

================================================= -->

        emissiveIntensity: 1;
    "

    animation="

        to: 0 360 0;
        loop: true;
        dur: 10000;
    "

>
</a-sphere>


<!-- LUZ DEL SOL -->

<a-light

    type="point"

    position="0 0.8 0"

    intensity="2"

    distance="10"
>
</a-light>

================================================= -->
