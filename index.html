<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>San Rafael AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #titulo {
            position: fixed;
            top: 15px;
            left: 0;
            right: 0;
            z-index: 9999;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            text-shadow: 2px 2px 4px black;
            pointer-events: none;
        }

        #titulo h1 {
            margin: 0;
            font-size: 28px;
        }

        #titulo p {
            margin: 5px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div id="titulo">
        <h1>🔬 SAN RAFAEL AR</h1>
        <p>La ciencia cobra vida</p>
    </div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        vr-mode-ui="enabled: false">

        <!-- Marcador Hiro -->
        <a-marker preset="hiro">

            <!-- Modelo 3D de prueba -->
            <a-entity position="0 0 0">

                <!-- Núcleo -->
                <a-sphere
                    position="0 1.2 0"
                    radius="0.45"
                    color="#8e44ad"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
                </a-sphere>

                <!-- Membrana -->
                <a-torus
                    position="0 1.2 0"
                    rotation="90 0 0"
                    radius="0.8"
                    radius-tubular="0.08"
                    color="#3498db">
                </a-torus>

                <!-- Orgánulos -->
                <a-sphere
                    position="0.6 1.2 0.2"
                    radius="0.15"
                    color="#e74c3c">
                </a-sphere>

                <a-sphere
                    position="-0.5 1.3 0.2"
                    radius="0.15"
                    color="#f1c40f">
                </a-sphere>

                <a-sphere
                    position="0 1.1 0.55"
                    radius="0.12"
                    color="#2ecc71">
                </a-sphere>

            </a-entity>

        </a-marker>

        <!-- Cámara -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
