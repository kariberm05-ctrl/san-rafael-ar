<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>San Rafael AR - Sistema Solar</title>

    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.JS -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }


        /* =========================
           CÁMARA
        ========================= */

        #arjs-video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            object-position: center center !important;
            z-index: 0 !important;
        }


        /* =========================
           LIENZO AR
        ========================= */

        .a-canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
        }


        /* =========================
           ENCABEZADO
        ========================= */

        #titulo {
            position: fixed;
            top: 12px;
            left: 0;
            right: 0;
            z-index: 9999;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            text-shadow: 2px 2px 5px black;
            pointer-events: none;
        }

        #titulo h1 {
            margin: 0;
            font-size: 27px;
        }

        #titulo p {
            margin: 4px;
            font-size: 15px;
        }


        /* =========================
           INSTRUCCIÓN
        ========================= */

        #instruccion {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;

            background: rgba(0, 0, 0, 0.70);
            color: white;

            padding: 10px 18px;
            border-radius: 20px;

            font-family: Arial, sans-serif;
            font-size: 14px;

            text-align: center;
            width: 80%;

            pointer-events: none;
        }

    </style>


    <!-- =========================
         MOVIMIENTO DE LOS PLANETAS
    ========================= -->

    <script>

        AFRAME.registerComponent('orbita', {

            schema: {

                velocidad: {
                    type: 'number',
                    default: 0.01
                },

                radio: {
                    type: 'number',
                    default: 1
                }

            },


            init: function () {

                this.angulo =
                    Math.random() * Math.PI * 2;

            },


            tick: function (time, deltaTime) {

                this.angulo +=
                    this.data.velocidad *
                    (deltaTime / 16);


                const x =
                    Math.cos(this.angulo) *
                    this.data.radio;


                const z =
                    Math.sin(this.angulo) *
                    this.data.radio;


                this.el.object3D.position.x = x;

                this.el.object3D.position.z = z;

            }

        });

    </script>

</head>


<body>


    <!-- =========================
         TÍTULO
    ========================= -->

    <div id="titulo">

        <h1>
            🌞 SAN RAFAEL AR 🪐
        </h1>

        <p>
            El Sistema Solar cobra vida
        </p>

    </div>


    <!-- =========================
         INSTRUCCIÓN
    ========================= -->

    <div id="instruccion">

        🔎 Apunta al marcador SAN RAFAEL AR

    </div>



    <!-- =========================
         ESCENA AR
    ========================= -->

    <a-scene

        embedded

        vr-mode-ui="enabled: false"

        renderer="
            antialias: true;
            alpha: true;
            logarithmicDepthBuffer: true;
        "

        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
        ">



        <!-- ========================================
             MARCADOR PERSONALIZADO SAN RAFAEL AR
        ========================================= -->

        <a-marker
            type="pattern"
            url="san-rafael-ar-marker.patt"
            id="sanRafaelMarker">


            <!-- =========================
                 SISTEMA SOLAR
            ========================= -->

            <a-entity

                id="sistemaSolar"

                position="0 0 0"

                scale="0.40 0.40 0.40">



                <!-- =========================
                     SOL
                ========================= -->

                <a-sphere

                    position="0 0.8 0"

                    radius="0.55"

                    color="#FDB813"

                    material="
                        emissive: #FDB813;
                        emissiveIntensity: 1;
                    "

                    animation="
                        property: rotation;
                        to: 0 360 0;
                        loop: true;
                        dur: 10000;
                    ">

                </a-sphere>


                <!-- LUZ DEL SOL -->

                <a-light

                    type="point"

                    position="0 0.8 0"

                    intensity="2"

                    distance="10">

                </a-light>



                <!-- =========================
                     MERCURIO
                ========================= -->

                <a-torus
                    position="0 0.8 0"
                    rotation="90 0 0"
                    radius="0.9"
                    radius-tubular="0.008"
                    color="#777777">
                </a-torus>


                <a-entity

                    position="0 0.8 0"

                    orbita="
                        velocidad: 0.030;
                        radio: 0.9;
                    ">


                    <a-sphere
                        radius="0.10"
                        color="#8E8E8E">
                    </a-sphere>


                    <a-text
                        value="Mercurio"
                        position="0 0.22 0"
                        align="center"
                        color="white"
                        width="1">
                    </a-text>

                </a-entity>



                <!-- =========================
                     VENUS
                ========================= -->

                <a-torus
                    position="0 0.8 0"
                    rotation="90 0 0"
                    radius="1.25"
                    radius-tubular="0.008"
                    color="#A67C52">
                </a-torus>


                <a-entity

                    position="0 0.8 0"

                    orbita="
                        velocidad: 0.024;
                        radio: 1.25;
                    ">


                    <a-sphere
                        radius="0.14"
                        color="#D99A3D">
                    </a-sphere>


                    <a-text
                        value="Venus"
                        position="0 0.25 0"
                        align="center"
                        color="white"
                        width="1">
                    </a-text>

                </a-entity>



                <!-- =========================
                     TIERRA
                ========================= -->

                <a-torus
                    position="0 0.8 0"
                    rotation="90 0 0"
                    radius="1.65"
                    radius-tubular="0.01"
                    color="#3498DB">
                </a-torus>


                <a-entity

                    position="0 0.8 0"

                    orbita="
                        velocidad: 0.020;
                        radio: 1.65;
                    ">


                    <!-- PLANETA TIERRA -->

                    <a-sphere
                        radius="0.18"
                        color="#2471A3">
                    </a-sphere>


                    <!-- CONTINENTE -->

                    <a-sphere
                        position="0.10 0.06 0.12"
                        radius="0.07"
                        color="#27AE60">
                    </a-sphere>


                    <!-- LUNA -->

                    <a-entity

                        orbita="
                            velocidad: 0.060;
                            radio: 0.35;
                        ">


                        <a-sphere
                            radius="0.055"
                            color="#D5D8DC">
                        </a-sphere>

                    </a-entity>


                    <a-text
                        value="Tierra"
                        position="0 0.30 0"
                        align="center"
                        color="white"
                        width="1">
                    </a-text>

                </a-entity>



                <!-- =========================
                     MARTE
                ========================= -->

                <a-torus
                    position="0 0.8 0"
                    rotation="90 0 0"
                    radius="2.05"
                    radius-tubular="0.008"
                    color="#C0392B">
                </a-torus>


                <a-entity

                    position="0 0.8 0"

                    orbita="
                        velocidad: 0.016;
                        radio: 2.05;
                    ">


                    <a-sphere
                        radius="0.13"
                        color="#C0392B">
                    </a-sphere>


                    <a-text
                        value="Marte"
                        position="0 0.25 0"
                        align="center"
                        color="white"
                        width="1">
                    </a-text>

                </a-entity>



                <!-- =========================
                     JÚPITER
                ========================= -->

                <a-torus
                    position="0 0.8 0"
                    rotation="90 0 0"
                    radius="2.55"
                    radius-tubular="0.008"
                    color="#B7956A">
                </a-torus>


                <a-entity

                    position="0 0.8 0"

                    orbita="
                        velocidad: 0.011;
                        radio: 2.55;
                    ">


                    <a-sphere
                        radius="0.28"
                        color="#C49A6C">
                    </a-sphere>


                    <a-text
                        value="Júpiter"
                        position="0 0.38 0"
                        align="center"
                        color="white"
                        width="1.1">
                    </a-text>

                </a-entity>



                <!-- =========================
                     SATURNO
                ========================= -->

                <a-torus
                    position="0 0.8 0"
                    rotation="90 0 0"
                    radius="3.05"
                    radius-tubular="0.008"
                    color="#D4AC6E">
                </a-torus>


                <a-entity

                    position="0 0.8 0"

                    orbita="
                        velocidad: 0.009;
                        radio: 3.05;
                    ">


                    <a-sphere
                        radius="0.25"
                        color="#D4AC6E">
                    </a-sphere>


                    <!-- ANILLOS DE SATURNO -->

                    <a-torus
                        rotation="90 0 0"
                        radius="0.38"
                        radius-tubular="0.035"
                        color="#E6CFA8">
                    </a-torus>


                    <a-text
                        value="Saturno"
                        position="0 0.40 0"
                        align="center"
                        color="white"
                        width="1.1">
                    </a-text>

                </a-entity>



                <!-- =========================
                     URANO
                ========================= -->

                <a-torus
                    position="0 0.8 0"
                    rotation="90 0 0"
                    radius="3.50"
                    radius-tubular="0.008"
                    color="#76D7C4">
                </a-torus>


                <a-entity

                    position="0 0.8 0"

                    orbita="
                        velocidad: 0.007;
                        radio: 3.50;
                    ">


                    <a-sphere
                        radius="0.18"
                        color="#76D7C4">
                    </a-sphere>


                    <a-text
                        value="Urano"
                        position="0 0.30 0"
                        align="center"
                        color="white"
                        width="1">
                    </a-text>

                </a-entity>



                <!-- =========================
                     NEPTUNO
                ========================= -->

                <a-torus
                    position="0 0.8 0"
                    rotation="90 0 0"
                    radius="3.90"
                    radius-tubular="0.008"
                    color="#3498DB">
                </a-torus>


                <a-entity

                    position="0 0.8 0"

                    orbita="
                        velocidad: 0.005;
                        radio: 3.90;
                    ">


                    <a-sphere
                        radius="0.18"
                        color="#3498DB">
                    </a-sphere>


                    <a-text
                        value="Neptuno"
                        position="0 0.30 0"
                        align="center"
                        color="white"
                        width="1">
                    </a-text>

                </a-entity>


            </a-entity>


        </a-marker>



        <!-- =========================
             CÁMARA AR
        ========================= -->

        <a-entity camera></a-entity>


    </a-scene>


</body>

</html>
