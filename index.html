<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>San Rafael AR - Sistema Solar</title>


    <!-- =========================================
         A-FRAME
    ========================================== -->

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>


    <!-- =========================================
         AR.JS
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


    <style>

        /* =========================================
           CONFIGURACIÓN GENERAL
        ========================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }


        /* =========================================
           CÁMARA
        ========================================== */

        #arjs-video {

            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;
            height: 100% !important;

            object-fit: contain !important;

            object-position: center center !important;

            z-index: 0 !important;
        }


        /* =========================================
           LIENZO AR
        ========================================== */

        .a-canvas {

            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;
            height: 100% !important;

            z-index: 1 !important;
        }


        /* =========================================
           ENCABEZADO
        ========================================== */

        #titulo {

            position: fixed;

            top: 12px;

            left: 0;
            right: 0;

            z-index: 9999;

            text-align: center;

            color: white;

            font-family: Arial, sans-serif;

            text-shadow:
                2px 2px 5px black;

            pointer-events: none;
        }


        #titulo h1 {

            margin: 0;

            font-size: 27px;
        }


        #titulo p {

            margin: 4px;

            font-size: 15px;
        }


    </style>

</head>


<body>


    <!-- =========================================
         ENCABEZADO
    ========================================== -->

    <div id="titulo">

        <h1>🌞 SAN RAFAEL AR 🪐</h1>

        <p>
            El Sistema Solar cobra vida
        </p>

    </div>



    <!-- =========================================
         ESCENA AR
    ========================================== -->

    <a-scene

        embedded

        vr-mode-ui="enabled: false"

        renderer="
            antialias: true;
            alpha: true;
            logarithmicDepthBuffer: true;
        "

        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
        ">


        <!-- =====================================
             MARCADOR HIRO
        ====================================== -->

        <a-marker
            preset="hiro">


            <!-- =================================
                 SISTEMA SOLAR COMPLETO
            ================================== -->

            <a-entity
                position="0 0 0"
                scale="0.55 0.55 0.55">


                <!-- =================================
                     SOL
                ================================== -->

                <a-sphere

                    position="0 1.5 0"

                    radius="0.65"

                    color="#FDB813"

                    material="
                        emissive: #FDB813;
                        emissiveIntensity: 0.8;
                    "

                    animation="
                        property: rotation;
                        to: 0 360 0;
                        loop: true;
                        dur: 10000;
                    ">

                </a-sphere>


                <!-- LUZ DEL SOL -->

                <a-light

                    type="point"

                    position="0 1.5 0"

                    intensity="2"

                    distance="8">

                </a-light>



                <!-- =================================
                     MERCURIO
                ================================== -->

                <a-entity

                    animation="
                        property: rotation;
                        to: 0 360 0;
                        loop: true;
                        dur: 5000;
                    ">

                    <a-sphere

                        position="0.9 1.5 0"

                        radius="0.12"

                        color="#9E9E9E">

                    </a-sphere>

                    <a-text

                        value="Mercurio"

                        position="0.9 1.75 0"

                        align="center"

                        color="white"

                        width="1.2">

                    </a-text>

                </a-entity>



                <!-- =================================
                     VENUS
                ================================== -->

                <a-entity

                    animation="
                        property: rotation;
                        to: 0 -360 0;
                        loop: true;
                        dur: 7000;
                    ">

                    <a-sphere

                        position="1.3 1.5 0"

                        radius="0.17"

                        color="#D99A3D">

                    </a-sphere>

                    <a-text

                        value="Venus"

                        position="1.3 1.78 0"

                        align="center"

                        color="white"

                        width="1.1">

                    </a-text>

                </a-entity>



                <!-- =================================
                     TIERRA
                ================================== -->

                <a-entity

                    animation="
                        property: rotation;
                        to: 0 360 0;
                        loop: true;
                        dur: 9000;
                    ">


                    <!-- TIERRA -->

                    <a-sphere

                        position="1.8 1.5 0"

                        radius="0.20"

                        color="#2471A3">

                    </a-sphere>


                    <!-- CONTINENTES -->

                    <a-sphere

                        position="1.72 1.56 0.13"

                        radius="0.08"

                        color="#27AE60">

                    </a-sphere>


                    <!-- LUNA -->

                    <a-entity

                        animation="
                            property: rotation;
                            to: 0 360 0;
                            loop: true;
                            dur: 3000;
                        ">

                        <a-sphere

                            position="2.15 1.5 0"

                            radius="0.06"

                            color="#D5D8DC">

                        </a-sphere>

                    </a-entity>


                    <a-text

                        value="Tierra"

                        position="1.8 1.82 0"

                        align="center"

                        color="white"

                        width="1.1">

                    </a-text>

                </a-entity>



                <!-- =================================
                     MARTE
                ================================== -->

                <a-entity

                    animation="
                        property: rotation;
                        to: 0 360 0;
                        loop: true;
                        dur: 11000;
                    ">

                    <a-sphere

                        position="2.35 1.5 0"

                        radius="0.15"

                        color="#C0392B">

                    </a-sphere>

                    <a-text

                        value="Marte"

                        position="2.35 1.77 0"

                        align="center"

                        color="white"

                        width="1.1">

                    </a-text>

                </a-entity>



                <!-- =================================
                     JÚPITER
                ================================== -->

                <a-entity

                    animation="
                        property: rotation;
                        to: 0 -360 0;
                        loop: true;
                        dur: 14000;
                    ">

                    <a-sphere

                        position="3.1 1.5 0"

                        radius="0.35"

                        color="#C49A6C">

                    </a-sphere>


                    <!-- FRANJAS -->

                    <a-torus

                        position="3.1 1.55 0"

                        rotation="90 0 0"

                        radius="0.25"

                        radius-tubular="0.025"

                        color="#8D6E63">

                    </a-torus>


                    <a-text

                        value="Júpiter"

                        position="3.1 2.0 0"

                        align="center"

                        color="white"

                        width="1.2">

                    </a-text>

                </a-entity>



                <!-- =================================
                     SATURNO
                ================================== -->

                <a-entity

                    animation="
                        property: rotation;
                        to: 0 360 0;
                        loop: true;
                        dur: 17000;
                    ">


                    <!-- PLANETA -->

                    <a-sphere

                        position="4.0 1.5 0"

                        radius="0.30"

                        color="#D4AC6E">

                    </a-sphere>


                    <!-- ANILLOS -->

                    <a-torus

                        position="4.0 1.5 0"

                        rotation="90 0 0"

                        radius="0.45"

                        radius-tubular="0.035"

                        color="#E6CFA8">

                    </a-torus>


                    <a-text

                        value="Saturno"

                        position="4.0 2.0 0"

                        align="center"

                        color="white"

                        width="1.2">

                    </a-text>

                </a-entity>



                <!-- =================================
                     URANO
                ================================== -->

                <a-entity

                    animation="
                        property: rotation;
                        to: 0 -360 0;
                        loop: true;
                        dur: 20000;
                    ">

                    <a-sphere

                        position="4.75 1.5 0"

                        radius="0.22"

                        color="#76D7C4">

                    </a-sphere>

                    <a-text

                        value="Urano"

                        position="4.75 1.83 0"

                        align="center"

                        color="white"

                        width="1.1">

                    </a-text>

                </a-entity>



                <!-- =================================
                     NEPTUNO
                ================================== -->

                <a-entity

                    animation="
                        property: rotation;
                        to: 0 360 0;
                        loop: true;
                        dur: 23000;
                    ">

                    <a-sphere

                        position="5.45 1.5 0"

                        radius="0.22"

                        color="#3498DB">

                    </a-sphere>

                    <a-text

                        value="Neptuno"

                        position="5.45 1.83 0"

                        align="center"

                        color="white"

                        width="1.1">

                    </a-text>

                </a-entity>



            </a-entity>


        </a-marker>



        <!-- =====================================
             CÁMARA
        ====================================== -->

        <a-entity camera></a-entity>


    </a-scene>


</body>

</html>
