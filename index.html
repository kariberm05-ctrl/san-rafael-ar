<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>San Rafael AR</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
        }

        header {
            padding: 20px;
            background: #1d3557;
            color: white;
        }

        h1 {
            margin: 0;
        }

        p {
            font-size: 18px;
        }

        .contenedor {
            padding: 30px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>🔬 SAN RAFAEL AR</h1>
        <p>La ciencia cobra vida</p>
    </header>

    <div class="contenedor">

        <h2>Bienvenido a nuestra experiencia de Realidad Aumentada</h2>

        <p>
            Escanea el código QR y descubre la ciencia
            de una manera diferente.
        </p>

        <button onclick="iniciar()">
            🚀 Iniciar experiencia
        </button>

    </div>

    <script>
        function iniciar() {
            alert("¡Nuestra experiencia de Realidad Aumentada está comenzando!");
        }
    </script>

</body>
</html>
